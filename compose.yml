services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steamtrades_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/steamkeys.db
      - DEFAULT_TF2_STEAM_PRICE=2.02
      - DEFAULT_TF2_CASH_PRICE=1.62
      - DEFAULT_STEAM_FEE_PERCENT=13.03

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steamtrades_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
