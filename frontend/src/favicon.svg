      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbff24" />
      <stop offset="100%" stop-color="#d77706" />
